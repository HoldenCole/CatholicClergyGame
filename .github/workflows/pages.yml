# Builds the game and publishes it to GitHub Pages, so the repository has
# a playable link of its own. Pages must be switched on once by a person,
# under Settings → Pages, with "GitHub Actions" as the source: the
# workflow's own token is not allowed to create the site. After that every
# push to main redeploys, and the "Run workflow" button deploys any branch
# by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Creates the Pages site on first run if the repository has none yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
